# Render Blueprint: one free web service that runs the game server and serves
# the built frontend (same URL for the page and the WebSocket).
# Render reads this file when you choose New → Blueprint and pick this repo.
# The four keys are marked sync: false, so Render asks you for them and they are
# never stored in Git.
services:
  - type: web
    name: the-pit
    runtime: node
    plan: free
    region: singapore          # closest Render region to Australia; can't be changed later
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: FINNHUB_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: AI_DAILY_ROUND_CAP
        value: "200"
      - key: AI_ROUNDS_PER_MIN_PER_ROOM
        value: "3"
